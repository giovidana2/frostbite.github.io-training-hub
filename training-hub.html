<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one app shell. Hub screen = menu of trainer cards grouped by purpose; opening one slides a full-screen
   frame in under a slim back bar. Each trainer stays loaded once opened, so switching back keeps its state.
   Single dark look shared with the whole trainer suite. */
:root{
  color-scheme:dark;
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
  --text:#e6edf3; --muted:#7d8590; --accent:#58a6ff; --felt:#0f3020; --rail:#1a5c35;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}

/* ── Hub ── */
#hub{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-block:28px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hub-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.hub-head{display:flex;flex-direction:column;gap:4px}
.hub-head h1{font-size:26px;font-weight:900;letter-spacing:-.5px;text-wrap:balance}
.hub-head .sub{font:400 12px var(--mono);color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font:700 10px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;align-items:start;
  transition:border-color .15s,transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gc:hover{border-color:var(--accent)}
.gc:active{transform:scale(.98)}
.gc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gc .icon{grid-row:1/4;width:44px;height:44px;border-radius:10px;background:var(--felt);border:1px solid var(--rail);
  display:grid;place-items:center;font:700 20px var(--mono);color:var(--text)}
.gc .gtitle{font-size:16px;font-weight:700}
.gc .gdesc{font-size:12px;color:var(--muted);line-height:1.5}
.gc .tag{justify-self:start;margin-top:6px;font:600 10px var(--mono);background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:3px 8px;color:var(--muted)}
.hub-foot{font:400 11px var(--mono);color:var(--muted);line-height:1.6}

/* ── Trainer view ── */
#view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20;
  transform:translateX(100%);transition:transform .22s ease-out;visibility:hidden}
#view.open{transform:none;visibility:visible}
.bar{flex:none;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);
  padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;font:700 13px var(--sans);color:var(--accent);
  padding:8px 10px;border-radius:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back:hover{background:var(--surface2)}
.back:focus-visible{outline:2px solid var(--accent)}
.bar .name{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frames{flex:1;position:relative;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (prefers-reduced-motion:reduce){#view{transition:none}}
</style>

</head>
<body>
<div id="hub">
  <div class="hub-in">
    <div class="hub-head">
      <h1>Training Hub</h1>
      <div class="sub">Giovanni's edge-building toolkit</div>
    </div>

    <section class="group" aria-label="Drills">
      <h2>Drills</h2>
      <div class="cards">
        <button class="gc" data-t="basic"><span class="icon">♠</span><span class="gtitle">Basic Strategy</span>
          <span class="gdesc">Hard totals, soft totals, pairs. Adaptive weak-spot drilling with explanations, streak counter, and timer.</span>
          <span class="tag">4–8 deck · S17 · DAS · LS</span></button>
        <button class="gc" data-t="deviations"><span class="icon">±</span><span class="gtitle">Deviations</span>
          <span class="gdesc">Given a true count, decide when to deviate. Index plays, insurance, and surrender deviations.</span>
          <span class="tag">H17 · Hi-Lo · Illustrious 18</span></button>
        <button class="gc" data-t="tray"><span class="icon">▤</span><span class="gtitle">Discard Tray</span>
          <span class="gdesc">Read the discard tray from 3D, front, and side views and call how many decks remain. Tracks hit rate, average error, and cards off.</span>
          <span class="tag">1–8 decks · ¼–½ deck tolerance</span></button>
        <button class="gc" data-t="math"><span class="icon">÷</span><span class="gtitle">Math Speed Trainer</span>
          <span class="gdesc">Division and multiplication drill for mental math speed. Sprint, practice, and targeted modes.</span>
          <span class="tag">0.5–6 ranges · 60-sec sprint</span></button>
      </div>
    </section>

    <section class="group" aria-label="Test-out">
      <h2>Test-out</h2>
      <div class="cards">
        <button class="gc" data-t="shoe"><span class="icon">♣</span><span class="gtitle">Shoe Test-Out</span>
          <span class="gdesc">Play a full shoe at a live-style table: bet with chips across two spots, take insurance, and read the tray and shoe down to the cut card.</span>
          <span class="tag">Full shoe · bets · insurance · cut card</span></button>
      </div>
    </section>

    <section class="group" aria-label="Reference">
      <h2>Reference</h2>
      <div class="cards">
        <button class="gc" data-t="charts"><span class="icon">▦</span><span class="gtitle">Charts</span>
          <span class="gdesc">Basic strategy and deviation tables that rebuild for decks, H17/S17, DAS, surrender and payout rules.</span>
          <span class="tag">BS · Surrender · Deviations</span></button>
      </div>
    </section>

    <p class="hub-foot">Tip: add this page to your home screen to open it like an app. Each trainer remembers its stats on this device.</p>
  </div>
</div>

<div id="view" aria-hidden="true">
  <div class="bar">
    <button class="back" id="back" type="button" aria-label="Back to Training Hub">‹ Hub</button>
    <span class="name" id="vname"></span>
  </div>
  <div class="frames" id="frames"></div>
</div>

function srcdoc(id){var b=atob(SRC[id]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
(function(){
  var T={
    basic:{name:'Basic Strategy',src:'trainers/basic.html'},
    deviations:{name:'Deviations',src:'trainers/deviations.html'},
    tray:{name:'Discard Tray',src:'trainers/tray.html'},
    math:{name:'Math Speed Trainer',src:'trainers/math.html'},
    shoe:{name:'Shoe Test-Out',src:'trainers/shoe.html'},
    charts:{name:'Charts',src:'trainers/charts.html'}
  };
  var view=document.getElementById('view'),frames=document.getElementById('frames'),
      vname=document.getElementById('vname'),hub=document.getElementById('hub');
  var loaded={},current=null,lastCard=null;

  function open(id,fromHash){
    var t=T[id]; if(!t) return;
    var f=loaded[id];
    if(!f){
      f=document.createElement('iframe');
      f.srcdoc=srcdoc(id); f.title=t.name;
      f.setAttribute('allow','fullscreen; screen-wake-lock');
      frames.appendChild(f); loaded[id]=f;
      f.addEventListener('load',function(){ if(current===id) try{f.contentWindow.focus();}catch(e){} });
    }
    for(var k in loaded) loaded[k].hidden=(k!==id);
    current=id; vname.textContent=t.name;
    view.classList.add('open'); view.setAttribute('aria-hidden','false'); hub.setAttribute('aria-hidden','true');
    try{f.contentWindow.focus();}catch(e){}
    if(!fromHash && location.hash!=='#'+id) try{history.pushState(null,'','#'+id);}catch(e){}
  }
  function close(fromHash){
    view.classList.remove('open'); view.setAttribute('aria-hidden','true'); hub.removeAttribute('aria-hidden');
    current=null;
    if(!fromHash && location.hash) try{history.pushState(null,'',location.href.split('#')[0]);}catch(e){}
    if(lastCard) lastCard.focus({preventScroll:true});
  }
  document.querySelectorAll('.gc').forEach(function(b){
    b.addEventListener('click',function(){ lastCard=b; open(b.dataset.t); });
  });
  document.getElementById('back').addEventListener('click',function(){ close(); });
  function syncHash(){
    var id=(location.hash||'').slice(1);
    if(T[id]) open(id,true); else if(current) close(true);
  }
  window.addEventListener('popstate',syncHash);
  window.addEventListener('hashchange',syncHash);
  syncHash();
})();
</script>
